      - run:
          name: Init vars
          command: |
            cat /var/tmp/east/rev-7227
      - run:
          name: Get source tree
          command: git clone --depth 3 --quiet --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Load vendor code
          command: tar --extract --xz --file=core-archive.tar.xz
      - run:
          name: Finalize build
          command: env | wc -l
      - run:
          name: Pre-run checks
          command: du -sh .
      - run:
